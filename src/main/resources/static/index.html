<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Graph Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Added Marked library for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .chat-bubble { max-width: 80%; }
        .trace-step { border-left: 2px solid #e5e7eb; padding-left: 1rem; margin-bottom: 0.5rem; }

        /* Markdown formatting styles for assistant responses */
        .markdown-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-content ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-content li { margin-bottom: 0.25rem; }
        .markdown-content p { margin-bottom: 1rem; }
        .markdown-content p:last-child { margin-bottom: 0; }
        .markdown-content strong { font-weight: bold; }
        .markdown-content em { font-style: italic; }
        .markdown-content code {
            background: rgba(0,0,0,0.05);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-family: monospace;
            font-size: 0.9em;
        }
        .markdown-content pre {
            background: #f3f4f6;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
            font-family: monospace;
            font-size: 0.9em;
        }
        .markdown-content pre code { background: transparent; padding: 0; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-6 flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-800">Groq Graph Chat</h1>
        <span class="text-sm text-green-500 flex items-center">
            <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span> Connected
        </span>
    </header>

    <!-- Chat Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex justify-start">
            <div class="bg-white text-gray-800 p-3 rounded-lg shadow-sm chat-bubble">
                Hello! Ask me anything, and I'll use the LangGraph pipeline to find the best answer.
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white border-t p-4">
        <div class="max-w-4xl mx-auto flex gap-4">
            <input type="text" id="user-input"
                   class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="Enter your question here...">
            <button id="send-btn"
                    class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors disabled:bg-gray-400">
                Send
            </button>
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(role, content, revisions = null, trace = null) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `p-3 rounded-lg shadow-sm chat-bubble ${
                role === 'user'
                ? 'bg-blue-600 text-white'
                : 'bg-white text-gray-800'
            }`;

            // If role is assistant, use marked to parse Markdown. Otherwise, use plain text.
            const formattedContent = role === 'assistant'
                ? `<div class="markdown-content">${marked.parse(content)}</div>`
                : `<div class="whitespace-pre-wrap">${content}</div>`;

            let html = formattedContent;

            if (revisions !== null) {
                html += `<div class="mt-2 pt-2 border-t text-xs opacity-70 italic">Revisions: ${revisions}</div>`;
            }

            if (trace && trace.length > 0) {
                html += `
                    <details class="mt-3">
                        <summary class="text-xs cursor-pointer font-semibold opacity-60 hover:opacity-100 transition-opacity">
                            View Execution Trace
                        </summary>
                        <div class="mt-2 space-y-2 text-xs font-mono text-gray-500">
                            ${trace.map((step, i) => `
                                <div class="trace-step">
                                    <span class="font-bold text-gray-700">Step ${i + 1}:</span> ${step}
                                </div>
                            `).join('')}
                        </div>
                    </details>
                `;
            }

            bubble.innerHTML = html;
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const question = userInput.value.trim();
            if (!question) return;

            // User message
            appendMessage('user', question);
            userInput.value = '';

            // Loading state
            sendBtn.disabled = true;
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'flex justify-start';
            loadingDiv.innerHTML = `<div class="bg-gray-200 text-gray-500 p-3 rounded-lg shadow-sm chat-bubble italic">Thinking...</div>`;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) throw new Error('Server error');

                const data = await response.json();

                // Remove loading indicator
                chatContainer.removeChild(loadingDiv);

                // Assistant message
                appendMessage('assistant', data.answer, data.revisions, data.trace);
            } catch (error) {
                chatContainer.removeChild(loadingDiv);
                appendMessage('assistant', `Error: ${error.message}. Please make sure the server is running.`);
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
